name: Deploy MemeVerdict website

on:
  push:
    branches: [main]
    paths:
      - "MemeVerdict/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: MemeVerdict/frontend/package-lock.json

      - name: Install dependencies
        working-directory: MemeVerdict/frontend
        run: npm ci

      - name: Build production dApp
        working-directory: MemeVerdict/frontend
        env:
          VITE_GENLAYER_RPC_URL: "https://studio.genlayer.com/api"
          VITE_GENLAYER_CHAIN_ID: "61999"
          VITE_GENLAYER_CHAIN_NAME: "GenLayer Studio"
          VITE_GENLAYER_SYMBOL: "GEN"
          VITE_MEMEVERDICT_CONTRACT_ADDRESS: "0x96a9B51C30a0Af126C7d4594489e2940F1f44621"
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: MemeVerdict/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
